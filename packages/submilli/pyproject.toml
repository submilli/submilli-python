[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "submilli"
version = "0.1.0"
description = "The Python SDK for submilli-server: run TypeScript programs under a Blueprint's policy, from any Python harness."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Submilli" }]
keywords = ["submilli", "agents", "code-mode", "sandbox", "llm", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/submilli/submilli-python/tree/main/packages/submilli"
Documentation = "https://github.com/submilli/submilli-python/tree/main/packages/submilli#readme"
Source = "https://github.com/submilli/submilli-python"
Changelog = "https://github.com/submilli/submilli-python/blob/main/packages/submilli/CHANGELOG.md"
"HTTP API" = "https://submilli.ai/docs/reference/http-api"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "respx>=0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/submilli"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit"]
markers = ["integration: starts a submilli-server from $SUBMILLI_BIN or PATH"]
filterwarnings = ["error"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", "examples"]
python_version = "3.11"

[tool.pyright]
include = ["src", "tests", "scripts", "examples"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-submilli"
version = "0.1.0"
description = "Submilli code mode for LangChain: run an agent's tool calls as TypeScript programs on submilli-server, under a Blueprint's policy."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Submilli" }]
keywords = ["langchain", "deepagents", "agents", "code-mode", "sandbox", "submilli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
# Tested with langchain 1.4.5, langchain-core 1.6.10, langgraph 1.2.15 and
# deepagents 0.7.24; see uv.lock for the exact set.
dependencies = [
    "submilli>=0.1.0,<0.2",
    "langchain>=1.4.5,<2",
    "langchain-core>=1.6.10,<2",
    "langgraph>=1.2.15,<2",
]

[project.optional-dependencies]
deepagents = ["deepagents>=0.7.24,<0.8"]

[project.urls]
Homepage = "https://github.com/submilli/submilli-python/tree/main/packages/langchain-submilli"
Documentation = "https://github.com/submilli/submilli-python/tree/main/packages/langchain-submilli#readme"
Source = "https://github.com/submilli/submilli-python"
Changelog = "https://github.com/submilli/submilli-python/blob/main/packages/langchain-submilli/CHANGELOG.md"
"Submilli runtime" = "https://github.com/submilli/submilli-runtime"

[dependency-groups]
test = [
    "deepagents>=0.7.24,<0.8",
    "langchain-tests>=1.1.9",
    "pytest>=8",
    "pytest-asyncio>=1",
    "respx>=0.22",
]
example = ["deepagents>=0.7.24,<0.8", "langchain-anthropic>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_submilli"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "NOTES.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a running submilli-server with the research Blueprint"]
testpaths = ["tests/unit_tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "examples/research"]
# The example's scripts import each other as top-level modules.
mypy_path = ["src", "examples/research"]
explicit_package_bases = true

[tool.pyright]
include = ["src", "tests", "examples/research"]
extraPaths = ["examples/research"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.uv.sources]
submilli = { workspace = true }
